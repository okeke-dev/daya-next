name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  quality:
    name: Quality (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

  package:
    name: Package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:exports
      - name: Verify npm pack contents
        run: npm pack --dry-run

  example-build:
    name: Example build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build package
        run: npm ci && npm run build
      - name: Install example (uses file:../../ and prepack)
        run: npm install
        working-directory: examples/with-app-router
      - name: Build example
        run: npm run build
        working-directory: examples/with-app-router
        env:
          DAYA_API_KEY: sk_sandbox_ci_placeholder
          DAYA_WEBHOOK_SECRET: whsec_ci_placeholder
      - name: Install example (basic-app)
        run: npm install
        working-directory: examples/basic-app
      - name: Build example (basic-app)
        run: npm run build
        working-directory: examples/basic-app
        env:
          DAYA_API_KEY: sk_sandbox_ci_placeholder
          DAYA_WEBHOOK_SECRET: whsec_ci_placeholder
